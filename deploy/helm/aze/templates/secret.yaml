{{- if not .Values.secrets.existingSecret }}
{{- if not .Values.secrets.jwtSecret }}
{{- fail "secrets.jwtSecret is required, or set secrets.existingSecret. The API refuses to start without it." }}
{{- end }}
{{- if not .Values.secrets.apiKey }}
{{- fail "secrets.apiKey is required, or set secrets.existingSecret. The API refuses to start without it." }}
{{- end }}
{{- if not .Values.secrets.databaseUrl }}
{{- fail "secrets.databaseUrl is required, or set secrets.existingSecret." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aze.fullname" . }}-secrets
  labels:
    {{- include "aze.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  API_KEY: {{ .Values.secrets.apiKey | quote }}
  {{- with .Values.secrets.redisUrl }}
  REDIS_URL: {{ . | quote }}
  {{- end }}
{{- end }}
