apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aze.fullname" . }}-client
  labels:
    {{- include "aze.labels" . | nindent 4 }}
    app.kubernetes.io/component: client
spec:
  replicas: {{ .Values.client.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "aze.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: client
  template:
    metadata:
      labels:
        {{- include "aze.labels" . | nindent 8 }}
        app.kubernetes.io/component: client
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: client
          image: {{ include "aze.image" (list .Values.client.image .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.client.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: HOSTNAME
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            # The client's server calls the API in-cluster, so this is a
            # Service name rather than anything a browser resolves. It is read
            # at request time, which is why one image serves every environment
            # — see apps/aze-client/src/lib/api.ts.
            - name: AZE_API_URL
              value: http://{{ include "aze.fullname" . }}-api:{{ .Values.api.service.port }}/api
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.client.resources | nindent 12 }}
          volumeMounts:
            - name: cache
              mountPath: /app/apps/aze-client/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
