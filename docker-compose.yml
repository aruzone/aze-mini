services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aze
      # Local development only. This password is public — it is committed to
      # this repository. Replace it before running this file anywhere but your
      # own machine.
      POSTGRES_PASSWORD: aze_local_password
      POSTGRES_DB: aze
    # Bound to the loopback interface deliberately: published as '5432:5432'
    # this would be reachable from the whole network with a password anyone
    # can read on GitHub.
    #
    # The host port is a variable so a second clone can publish elsewhere.
    # Neither service pins a container_name: names are global to the Docker
    # daemon and are held even by a stopped container, so a pinned one stops
    # a second clone from starting until the first is removed. Compose derives
    # a name per project instead, and 'docker compose -p <name>' separates two
    # clones completely. A clone using another port has to say so in its
    # apps/aze-api/.env — DATABASE_URL and REDIS_URL carry it too.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    # Postgres 18+ expects a single mount at /var/lib/postgresql, not at
    # /var/lib/postgresql/data — it stores data in a versioned subdirectory.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aze -d aze']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Loopback for the same reason Postgres is, and with more force: Redis has
    # no password here at all.
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    # No volume, deliberately. Everything in here is a copy of a row in
    # Postgres, and the API answers correctly with an empty cache (ADR-0005),
    # so persisting it across restarts would only preserve staleness.
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies the committed migrations and exits. The API waits on it completing
  # successfully, so a fresh volume is migrated before anything reads from it
  # and `docker compose up` needs no second command. `deploy`, not `dev`: it
  # never writes a migration, so a schema change nobody migrated fails here
  # rather than being invented at startup.
  migrate:
    build:
      context: .
      dockerfile: apps/aze-api/Dockerfile
      # Not the runtime image: the Prisma CLI is a development dependency the
      # runtime image deliberately does not carry. See apps/aze-api/Dockerfile.
      target: migrator
    environment:
      DATABASE_URL: postgresql://aze:aze_local_password@postgres:5432/aze?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/aze-api/Dockerfile
    restart: unless-stopped
    environment:
      # The service names above, not localhost: inside the compose network each
      # container is its own localhost.
      DATABASE_URL: postgresql://aze:aze_local_password@postgres:5432/aze?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      # Local development only, and public — this file is committed. The API
      # refuses to start while either still holds its .env.example placeholder,
      # so these are real values rather than the your_..._here shape. Replace
      # both before running this anywhere but your own machine.
      JWT_SECRET: compose_local_jwt_secret_change_me
      API_KEY: compose_local_api_key_change_me
      API_DOCS: 'true'
      # The client this file also runs. A deployment names its own origin
      # instead of editing any code.
      CORS_ORIGIN: http://localhost:3000
      # Nothing proxies the API here, so X-Forwarded-For is not to be believed:
      # trusting it would let any caller choose the address login throttling
      # counts them under.
      TRUST_PROXY: 'false'
    ports:
      - '127.0.0.1:${API_PORT:-3030}:3030'
    # The root route is public, so this needs no credential. Without a
    # healthcheck `docker compose up --wait` would return as soon as the
    # process existed, which is well before it answers.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3030/api').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  client:
    build:
      context: .
      dockerfile: apps/aze-client/Dockerfile
    restart: unless-stopped
    environment:
      # Read by the Next server, which is what calls the API — so this is the
      # compose service name and not something a browser has to resolve.
      AZE_API_URL: http://api:3030/api
    ports:
      - '127.0.0.1:${CLIENT_PORT:-3000}:3000'
    # /login is the one page that renders without a session.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/login').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
