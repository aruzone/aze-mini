{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "aze.fullname" . }}-migrate
  labels:
    {{- include "aze.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # Before the API rolls, so a new column exists by the time code selecting
    # it is serving. A failure here stops the release rather than leaving the
    # two out of step.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "aze.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "aze.image" (list .Values.migrate.image .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.migrate.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          # deploy, not dev: it applies the committed migrations and never
          # writes one, so a schema change nobody migrated fails here.
          command: ["npx", "prisma", "migrate", "deploy"]
          workingDir: /app/apps/aze-api
          envFrom:
            - secretRef:
                name: {{ include "aze.secretName" . }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
