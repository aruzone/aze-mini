apiVersion: v1
kind: Service
metadata:
  name: {{ include "aze.fullname" . }}-client
  labels:
    {{- include "aze.labels" . | nindent 4 }}
    app.kubernetes.io/component: client
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.client.service.port }}
      targetPort: http
  selector:
    app.kubernetes.io/name: {{ include "aze.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: client
