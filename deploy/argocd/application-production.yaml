# The production Application, pointing at the chart in this repository.
#
# Demo — see docs/demo.md. Edit repoURL and the destination, then
# `kubectl apply -f` this into the namespace Argo CD runs in.
#
# Production pins a tag, never a branch: nothing reaches Users unless someone
# decided to promote it. Promoting means bumping targetRevision below once
# staging has seen the same build — a one-line change that is visible and
# reviewable like any other. See ADR-0004 — an Adopter owns what they are
# running; this file is where that ownership is exercised.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aze-production
  namespace: argocd
  finalizers:
    # Deleting the Application takes what it created with it. Drop this line
    # if you would rather a deletion left the workloads running.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    # Yours, not this one.
    repoURL: https://github.com/your-org/your-repo.git
    # A tag or a commit, not a branch: a branch means the cluster's contents
    # change when someone merges, which is not a promotion anyone decided to
    # make. (Staging tracks main on purpose — see application-staging.yaml.)
    targetRevision: v0.2.0
    path: deploy/helm/aze

    helm:
      valueFiles:
        - values-production.yaml
      # Secrets do not belong in Git in any form. Create one out of band —
      # sealed-secrets, external-secrets or your cloud's own store — named as
      # the overlay's secrets.existingSecret expects. Production's Secret is
      # never shared with staging's.
      parameters:
        - name: api.image.repository
          value: ghcr.io/your-org/aze-api
        - name: client.image.repository
          value: ghcr.io/your-org/aze-client
        - name: migrate.image.repository
          value: ghcr.io/your-org/aze-migrate

  destination:
    server: https://kubernetes.default.svc
    namespace: aze-production

  syncPolicy:
    automated:
      # Argo removes what the chart stopped rendering, and puts back what was
      # changed by hand in the cluster.
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The migration Job is a Helm pre-upgrade hook. Argo runs hooks as its
      # own sync phases, and without this the completed Job from the previous
      # sync blocks the next one.
      - ApplyOutOfSyncOnly=true
